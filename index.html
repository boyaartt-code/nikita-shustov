<html lang="ru">

  <header class="bar glass">
    <nav class="bar__nav bar__nav--left" aria-label="Разделы">

    <h1 class="bar__name" data-split>Никита Шустов</h1>

</svg></div>
        <div class="decor__item chip chip--term" style="--d:.8">
          <div class="term__bar"><i></i><i></i><i></i><span>vibe.sh</span></div>
          <div class="term__line"><b>$</b> claude "сделай красиво"</div>
          <div class="term__line term__ok">✓ готово за 3 сек</div>
          <div class="term__line"><b>$</b> git push<span class="term__cur"></span></div>
        </div>
        <div class="decor__item chip chip--code" style="--d:1.3">&lt;/&gt;</div>
        <div class="decor__item chip chip--brace" style="--d:1.1">{ vibe: <em>true</em> }</div>
        <div class="decor__item chip chip--ai" style="--d:.9"><span>✦</span> AI</div>

      <div class="hero__buddy" data-vbuddy aria-label="Анимированный Никита"></div>

    <aside class="property glass" id="property" aria-label="Имущество">

    <div class="modal__backdrop" data-close></div>
    <div class="modal__box glass" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal__head">
        <h2 class="modal__title" id="modal-title"></h2>
        <button class="modal__close" data-close aria-label="Закрыть">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="modal__body" id="modal-body"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="buddy/phrases.js"></script>
  <script src="buddy/buddy.js"></script>
